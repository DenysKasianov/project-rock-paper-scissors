<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
    <script src="javaScript.js" defer></script>
  </head>
  <body>
    <section class="mainContainer">
      <h1>Welcome to the Rock, Paper, Scissors game!</h1>
      <h3>Please make your choice below:</h3>
      <div class="rock">
        <img
          id="rockImage"
          src="assets/rock.webp"
          alt="image of the hand sign of the rock"
        />
      </div>
      <div class="paper">
        <img
          id="paperImage"
          src="assets/paper.jpg"
          alt="image of the hand sign of the paper"
        />
      </div>
      <div class="scissors">
        <img
          id="scissorsImage"
          src="assets/scissors.webp"
          alt="image of the hand sign of the scissors"
        />
      </div>
    </section>
  </body>
</html>
